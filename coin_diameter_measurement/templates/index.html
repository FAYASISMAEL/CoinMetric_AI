<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CoinMetric AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-900 text-slate-200 min-h-screen">

<div class="max-w-6xl mx-auto px-6 py-10">

    <div class="text-center mb-10">
        <h1 class="text-4xl font-bold text-sky-400"> ShapeMetric AI</h1>
        <p class="text-slate-400 mt-2">
            Shape Detection with Diameter Measurement
        </p>
    </div>

    <div class="bg-slate-800 rounded-xl p-8 mb-10 shadow-lg">
        <form method="POST" enctype="multipart/form-data" class="space-y-6">

            <label class="border-2 border-dashed border-sky-400 rounded-lg p-10 flex flex-col items-center cursor-pointer hover:bg-slate-700">
                <input id="imageInput" type="file" name="image" accept="image/*" class="hidden" required>
                <span class="text-sky-400 font-semibold">📁 Upload Image</span>
            </label>

            <div class="flex gap-4">
                <button type="submit"
                    class="w-full bg-sky-400 text-slate-900 font-bold py-3 rounded-lg hover:bg-sky-300">
                    Process Image
                </button>

                <button type="button"
                    onclick="clearResults()"
                    class="w-full bg-red-500 text-white font-bold py-3 rounded-lg hover:bg-red-400">
                    Clear
                </button>
            </div>
        </form>
    </div>

    {% if output_image %}
    <div id="resultSection" class="bg-slate-800 rounded-xl p-8 shadow-lg">

        <img src="{{ url_for('static', filename='outputs/' + output_image) }}"
             class="mx-auto mb-8 rounded-lg border">

        <table class="w-full border border-slate-700">
            <thead class="bg-slate-900">
                <tr>
                    <th class="p-3 border">Object #</th>
                    <th class="p-3 border">Shape</th>
                    <th class="p-3 border">Diameter (mm)</th>
                </tr>
            </thead>
            <tbody>
                {% for obj in table %}
                <tr class="text-center hover:bg-slate-700">
                    <td class="p-3 border">{{ obj.id }}</td>
                    <td class="p-3 border">{{ obj.shape }}</td>
                    <td class="p-3 border">{{ obj.diameter }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>

    </div>
    {% endif %}
</div>

<script>
function clearResults() {
    document.getElementById("imageInput").value = "";
    document.getElementById("resultSection")?.remove();
}
</script>

</body>
</html>
